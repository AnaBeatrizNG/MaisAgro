<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaisAgro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1E4D08;--green-mid:#2E6B0F;--green-light:#4E8A1A;--green-bg:#EAF3DE;
  --gray-bg:#F6F4F0;--border:#E2DDD6;--text:#18181B;--text2:#62605C;--text3:#A09D98;
  --white:#FFFFFF;--danger:#B91C1C;--danger-bg:#FEF2F2;--amber:#92400E;--amber-bg:#FFFBEB;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;--coal:#3C3C39;--coal-bg:#F4F3F0;
  --radius:12px;--radius-sm:8px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:#EDEAE4;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:224px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .25s;overflow-y:auto;box-shadow:var(--shadow-md)}
.main{flex:1;margin-left:220px;padding:24px;transition:margin .25s}
@media(max-width:768px){
  .sidebar{transform:translateX(-224px)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:12px;padding-bottom:80px}
  .metrics{grid-template-columns:1fr 1fr!important}
  .grid2{grid-template-columns:1fr!important}
  .card{padding:14px 14px;margin-bottom:12px}
  .topbar{margin-bottom:14px}
  .ptitle{font-size:16px}
  .met-val{font-size:20px}
  .tbl{font-size:11px}
  .tbl th{font-size:9px;padding:0 6px 8px}
  .tbl td{padding:7px 6px}
  .ch{margin-bottom:10px}
  .ct{font-size:13px}
  .btn{font-size:11px;padding:6px 10px}
  .badge{font-size:9px;padding:2px 6px}
  .resp-row{gap:4px}
  .resp-btn{padding:6px 8px;font-size:11px}
}
/* Celular pequeno */
@media(max-width:390px){
  .metrics{grid-template-columns:1fr!important}
  .main{padding:10px}
  .met-val{font-size:18px}
}
@media(max-width:600px){
  .metrics-3{grid-template-columns:1fr!important}
  .tipo-grid{grid-template-columns:repeat(2,1fr)!important}
  .topbar .btn-primary span{display:none}
}
/* Tabelas no celular — scroll horizontal */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* Card do arroba — ajuste mobile */
@media(max-width:600px){
  .at-card-inner{flex-direction:column!important;align-items:flex-start!important}
  .at-input-row{width:100%!important;justify-content:flex-start!important}
}
.logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-title{font-size:17px;font-weight:800;color:var(--green);letter-spacing:-.3px}
.logo-sub{font-size:11px;color:var(--text2);margin-top:2px}
.nav{flex:1;padding:10px 8px}
.nav-sec{font-size:10px;color:var(--text3);padding:10px 8px 4px;letter-spacing:.06em;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s;font-weight:500}
.ni:hover{background:var(--gray-bg);color:var(--text)}
.ni.active{background:var(--green-bg);color:var(--green);font-weight:600}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:8px;flex-wrap:wrap;min-height:44px}
.ptitle{font-size:18px;font-weight:700;color:var(--text)}
.menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text);padding:4px}
@media(max-width:768px){.menu-btn{display:block}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99}
.overlay.show{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white);font-size:12px;cursor:pointer;color:var(--text);font-weight:500;transition:background .15s}
.btn:hover{background:var(--gray-bg)}
.btn-primary{background:var(--green);border-color:var(--green);color:var(--white);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn-primary:hover{background:var(--green-mid);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:14px;font-weight:600;color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.met{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.met-lbl{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.met-val{font-size:24px;font-weight:700;color:var(--text);line-height:1.2}
.met-sub{font-size:11px;margin-top:3px}
.up{color:var(--green-mid)}.down{color:var(--danger)}.neu{color:var(--text2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.badge{display:inline-flex;align-items:center;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.bg{background:var(--green-bg);color:var(--green)}.br{background:var(--danger-bg);color:var(--danger)}
.ba{background:var(--amber-bg);color:var(--amber)}.bb{background:var(--blue-bg);color:var(--blue)}
.bc{background:var(--coal-bg);color:var(--coal)}
.tbl{width:100%;font-size:12px;border-collapse:collapse;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;font-weight:600;color:var(--text2);padding:0 8px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#FAFAF8}
.muted{color:var(--text2)!important}
.fields{display:grid;gap:12px}
.f2{grid-template-columns:1fr 1fr}
.f3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.f2,.f3{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--white);color:var(--text)}
.field input:focus,.field select:focus{outline:none;border-color:var(--green-light)}
.field textarea{resize:vertical;min-height:70px}
.tipo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
@media(max-width:600px){.tipo-grid{grid-template-columns:repeat(2,1fr)}}
.tipo-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 6px;border-radius:var(--radius);border:1.5px solid var(--border);cursor:pointer;background:var(--white);transition:all .15s;text-align:center}
.tipo-btn:hover{background:var(--gray-bg)}
.tipo-btn.sel{border-color:var(--green-light);background:var(--green-bg)}
.tipo-lbl{font-size:11px;font-weight:600;color:var(--text);line-height:1.3}
.tipo-sub{font-size:10px;color:var(--text2)}
.resp-row{display:flex;gap:6px;flex-wrap:wrap}
.resp-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:12px;font-weight:500;color:var(--text2);background:var(--white)}
.resp-btn.sel{border-color:var(--green-light);background:var(--green-bg);color:var(--green)}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bar-wrap{width:80px;height:5px;background:var(--gray-bg);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.confirm-box{background:var(--gray-bg);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:none}
.confirm-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border)}
.confirm-row:last-child{border-bottom:none}
.success-box{background:var(--green-bg);border:1px solid var(--green-light);border-radius:var(--radius);padding:20px;text-align:center;display:none;margin-bottom:16px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:var(--white);padding:12px 20px;border-radius:var(--radius);font-size:13px;font-weight:500;z-index:999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.loading{text-align:center;padding:32px;color:var(--text2);font-size:13px}
.corte-badge{display:inline-flex;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600}
.c1{background:var(--green-bg);color:var(--green)}.c2{background:var(--blue-bg);color:var(--blue)}.c3{background:var(--amber-bg);color:var(--amber)}

/* MODAL EDIÇÃO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:var(--radius);padding:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
/* CHART */
.chart-bar-group{display:flex;align-items:flex-end;gap:3px}
.chart-bar{border-radius:3px 3px 0 0;min-width:8px;transition:opacity .15s}
.chart-bar:hover{opacity:.8}
</style>
</head>

<script>
const SUPABASE_URL = 'https://ymodddawexptdrbzklur.supabase.co';
const SUPABASE_KEY = 'sb_publishable_i7ozfss6NIFcQ13MbNYWGg_-VJlB_R-';
const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MESES_FULL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

async function sb(table,method='GET',body=null,filters=''){
  const url=`${SUPABASE_URL}/rest/v1/${table}${filters}`;
  const headers={
    'apikey':SUPABASE_KEY,
    'Authorization':`Bearer ${SUPABASE_KEY}`,
    'Content-Type':'application/json',
    'Prefer':method==='POST'?'return=representation':method==='PATCH'?'return=representation':'',
  };
  // Para GET, adicionar Range para suportar mais de 1000 registros
  if(method==='GET') headers['Range']='0-9999';
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.text();throw new Error(e)}
  return method==='DELETE'?null:res.json();
}

let currentPage='dashboard', respAtual='Eduardo', tipoAtual='compra-gado';

function nav(page,el){
  currentPage=page;
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  if(el)el.classList.add('active');
  closeSidebar();
  updateBottomNav(page);
  renderPage(page);
}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function toast(msg,error=false){const t=document.getElementById('toast');t.textContent=msg;t.style.background=error?'#A32D2D':'#27500A';t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
function fmt(v){if(!v&&v!==0)return'—';return'R$ '+parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtAt(v){if(!v&&v!==0)return'—';return parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'@'}
function pesoParaAt(kg){return kg/30}


function fazerLogin(nome, iniciais, bg, cor) {
  respAtual = nome;
  sessionStorage.setItem('maisagro_user', JSON.stringify({nome, iniciais, bg, cor}));
  document.getElementById('login-screen').style.display = 'none';
  checkMobile();
  // Atualizar sidebar
  const av = document.getElementById('sidebar-avatar');
  const nm = document.getElementById('sidebar-nome');
  if(av){ av.style.background=bg; av.style.color=cor; av.textContent=iniciais; }
  if(nm){ nm.textContent=nome; }
  // Pre-selecionar responsavel nos lancamentos
  verificarLogin();
if(sessionStorage.getItem('maisagro_user')) renderPage('dashboard').then(()=>carregarArroba());
}

function fazerLogout() {
  sessionStorage.removeItem('maisagro_user');
  document.getElementById('login-screen').style.display = 'flex';
}


async function carregarArroba() {
  try {
    const res = await sb('lancamentos','GET',null,'?tipo=eq.arroba_mg&order=data_lancamento.desc&limit=1');
    if(res && res.length > 0) {
      const r = res[0];
      const val = document.getElementById('dash-at-valor');
      const dt = document.getElementById('dash-at-data');
      const rb = document.getElementById('dash-at-rebanho');
      const inp = document.getElementById('at-input');
      if(val) val.textContent = 'R$ ' + parseFloat(r.valor).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
      if(dt) dt.textContent = r.data_lancamento ? new Date(r.data_lancamento+'T12:00:00').toLocaleDateString('pt-BR') : '';
      if(inp) inp.value = r.valor;
      // Calcular valor estimado do rebanho
      const lancs2 = await sb('lancamentos','GET',null,'?or=(tipo.eq.compra-gado,tipo.eq.venda-gado)&limit=500');
      const compras = lancs2.filter(l=>l.tipo==='compra-gado').reduce((a,l)=>a+(l.quantidade||0),0);
      const vendas = lancs2.filter(l=>l.tipo==='venda-gado').reduce((a,l)=>a+(l.quantidade||0),0);
      const cabecas = compras - vendas;
      const pesagens = await sb('lancamentos','GET',null,'?tipo=eq.pesagem&order=data_lancamento.desc&limit=1');
      const pesoMedio = pesagens.length>0 ? pesagens[0].peso_medio : 0;
      if(rb && cabecas>0 && pesoMedio>0) {
        const atPorCab = pesoMedio * 0.5 / 30;
        const valorRebanho = cabecas * atPorCab * r.valor;
        rb.textContent = `Rebanho estimado: R$ ${valorRebanho.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})} (${cabecas} cab. × ${atPorCab.toFixed(1)}@ × R$ ${r.valor})`;
      } else if(rb) {
        rb.textContent = cabecas>0 ? `${cabecas} cabeças no pasto — registre uma pesagem para ver o valor estimado` : '';
      }
    }
  } catch(e) { console.error(e); }
}

async function salvarArroba() {
  const val = document.getElementById('at-input')?.value;
  if(!val) { toast('Digite o valor da @', true); return; }
  const valor = parseFloat(val.replace(',','.'));
  if(isNaN(valor)||valor<=0) { toast('Valor inválido', true); return; }
  try {
    const hoje = new Date().toISOString().split('T')[0];
    await sb('lancamentos','POST',{
      tipo: 'arroba_mg',
      valor,
      data_lancamento: hoje,
      registrado_por: respAtual,
      descricao: 'Arroba MG — média 5 dias',
      propriedade: 'Taquara'
    });
    toast('@ atualizada!');
    await carregarArroba();
  } catch(e) { toast('Erro: '+e.message, true); }
}

function updateBottomNav(page) {
  const ids = ['dashboard','rebanho','financeiro','consolidado','lancamentos'];
  ids.forEach(id => {
    const btn = document.getElementById('bn-'+id);
    if(!btn) return;
    if(id === page) {
      btn.style.background = id==='lancamentos' ? 'var(--green)' : 'var(--green-bg)';
      btn.querySelectorAll('span')[1].style.color = id==='lancamentos' ? '#fff' : 'var(--green)';
      btn.querySelectorAll('span')[1].style.fontWeight = '700';
    } else {
      btn.style.background = id==='lancamentos' ? 'var(--green)' : 'none';
      btn.querySelectorAll('span')[1].style.color = id==='lancamentos' ? '#fff' : 'var(--text2)';
      btn.querySelectorAll('span')[1].style.fontWeight = id==='lancamentos' ? '600' : '500';
    }
  });
}

function checkMobile() {
  const isMobile = window.innerWidth <= 768;
  const bn = document.getElementById('bottom-nav');
  if(bn) bn.style.display = isMobile ? 'block' : 'none';
}

window.addEventListener('resize', checkMobile);

function verificarLogin() {
  const u = sessionStorage.getItem('maisagro_user');
  if(u) {
    const {nome, iniciais, bg, cor} = JSON.parse(u);
    respAtual = nome;
    document.getElementById('login-screen').style.display = 'none';
  checkMobile();
    const av = document.getElementById('sidebar-avatar');
    const nm = document.getElementById('sidebar-nome');
    if(av){ av.style.background=bg; av.style.color=cor; av.textContent=iniciais; }
    if(nm){ nm.textContent=nome; }
  }
}

async function renderPage(page){
  const c=document.getElementById('page-content');
  c.innerHTML='<div class="loading">Carregando...</div>';
  try{
    if(page==='dashboard'){ await renderDashboard(); setTimeout(carregarArroba,100); }
    else if(page==='rebanho') await renderRebanho();
    else if(page==='carvao') await renderCarvao();
    else if(page==='propriedades') await renderPropriedades();
    else if(page==='financeiro') await renderFinanceiro();
    else if(page==='fechamento') await renderFechamento();
    else if(page==='consolidado') await renderConsolidado();
    else if(page==='detalhe_receitas') await renderDetalheReceitas();
    else if(page==='detalhe_despesas') await renderDetalheDespesas();
    else if(page==='sienge') await renderSienge();
    else if(page==='alertas') await renderAlertas();
    else if(page==='metas') await renderMetas();
    else if(page==='recorrentes') await renderRecorrentes();
    else if(page==='lancamentos') renderLancamentos();
  }catch(e){c.innerHTML=`<div class="loading">Erro: ${e.message}</div>`}
}

  ]);

  const compras = lancs.filter(l=>l.tipo==='compra-gado');
  const vendas  = lancs.filter(l=>l.tipo==='venda-gado');
  const cabecas = compras.reduce((a,l)=>a+(l.quantidade||0),0) - vendas.reduce((a,l)=>a+(l.quantidade||0),0);

  // Arroba média do rebanho (última pesagem de cada lote)
  const pesagens = lancs.filter(l=>l.tipo==='pesagem' && l.peso_medio);
  const pesoMedio = pesagens.length>0 ? pesagens[pesagens.length-1].peso_medio : 0;
  const atTotal = pesoMedio>0 ? (cabecas * pesoMedio * 0.5 / 30) : 0; // 50% rendimento

  // Receita e despesa por mês para o gráfico
  const porMes = {};
  lancs.forEach(l=>{
    if(!l.data_lancamento||!l.valor) return;
    const d=new Date(l.data_lancamento+'T12:00:00');
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!porMes[key]) porMes[key]={label:MESES_PT[d.getMonth()]+'/'+String(d.getFullYear()).slice(2),rec:0,desp:0};
    if(['venda-gado','venda-carvao'].includes(l.tipo)) porMes[key].rec+=(l.valor||0);
    else if(['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo)) porMes[key].desp+=(l.valor||0);

  const meses = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);
  const recManual = lancs.filter(l=>['venda-gado','venda-carvao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);

  const despSienge = siengeLancs.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+(l.valor||0),0);

function renderChartBars(meses, barH, maxVal) {
  if(meses.length===0) return '<div class="loading">Nenhum lançamento com data e valor ainda</div>';
  return `<div style="display:flex;align-items:flex-end;gap:12px;padding:8px 0 24px;min-height:${barH+40}px">
    ${meses.map(([key,m])=>{
      const hRec=Math.round((m.rec/maxVal)*barH);
      const hDesp=Math.round((m.desp/maxVal)*barH);
      const res=m.rec-m.desp;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:52px">
        <div style="font-size:10px;color:${res>=0?'var(--green-mid)':'var(--danger)'};font-weight:700">${res>=0?'+':''}${Math.round(res/1000)}k</div>
        <div style="display:flex;align-items:flex-end;gap:3px;height:${barH}px">
          <div class="chart-bar" style="width:20px;height:${Math.max(hRec,3)}px;background:var(--green-light);border-radius:4px 4px 0 0" title="Receita: ${fmt(m.rec)}"></div>

}

async function atualizarGrafico() {
  const fazFilt = document.getElementById('chart-fazenda')?.value || 'all';
  const periodo = parseInt(document.getElementById('chart-periodo')?.value || '6');
  const area = document.getElementById('chart-area');
  if(!area) return;

  try {
    const filtro = fazFilt==='all' ? '?order=data_lancamento.asc&limit=500' : `?propriedade=eq.${encodeURIComponent(fazFilt)}&order=data_lancamento.asc&limit=500`;
    const [lancs, siengeLancs] = await Promise.all([
      sb('lancamentos','GET',null,filtro),
      fazFilt==='all' ? sb('sienge_lancamentos','GET',null,'?order=criado_em.asc&limit=5000').catch(()=>[]) :
        sb('sienge_lancamentos','GET',null,`?fazenda=eq.${encodeURIComponent(fazFilt)}&order=criado_em.asc&limit=500`).catch(()=>[])
    ]);

    const porMes = {};
    lancs.forEach(l=>{
      if(!l.data_lancamento||!l.valor) return;
      const d=new Date(l.data_lancamento+'T12:00:00');
      const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!porMes[key]) porMes[key]={label:MESES_PT[d.getMonth()]+'/'+String(d.getFullYear()).slice(2),rec:0,desp:0};
      if(['venda-gado','venda-carvao'].includes(l.tipo)) porMes[key].rec+=(l.valor||0);
      else if(['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo)) porMes[key].desp+=(l.valor||0);
    });

    siengeLancs.forEach(l=>{
      if(!l.mes_ano||!l.valor) return;
      const partes = l.mes_ano.split('/');
      if(partes.length!==2) return;
      const key = partes[1]+'-'+partes[0].padStart(2,'0');
      const label = MESES_PT[parseInt(partes[0])-1]+'/'+partes[1].slice(2);
      if(!porMes[key]) porMes[key]={label,rec:0,desp:0};
      if(l.tipo==='receita') porMes[key].rec+=(l.valor||0); // inclui deduções negativas
      else if(l.tipo==='despesa') porMes[key].desp+=(l.valor||0);
    });

    let meses = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0]));
    if(periodo>0) meses = meses.slice(-periodo);
    const maxVal = meses.length>0 ? Math.max(...meses.map(([,m])=>Math.max(m.rec,m.desp)),1) : 1;
    const barH = 140;

    area.innerHTML = renderChartBars(meses, barH, maxVal);
  } catch(e) { console.error(e); }
}

}

async function renderCarvao(){
  const lancs = await sb('lancamentos','GET',null,"?or=(tipo.eq.prod-carvao,tipo.eq.venda-carvao)&order=data_lancamento.asc&limit=500");
  const prods  = lancs.filter(l=>l.tipo==='prod-carvao');
  const vendas = lancs.filter(l=>l.tipo==='venda-carvao');
  const fazendas = ['Pombinha','Pindorama','Morro da Garça','Área do Junco'];

  const resumo = {};
  fazendas.forEach(f=>{
    const p=prods.filter(l=>l.propriedade===f).reduce((a,l)=>a+(l.toneladas||0),0);
    const v=vendas.filter(l=>l.propriedade===f).reduce((a,l)=>a+(l.toneladas||0),0);
    const rec=vendas.filter(l=>l.propriedade===f).reduce((a,l)=>a+(l.valor||0),0);
    const tonsVendidas=vendas.filter(l=>l.propriedade===f).reduce((a,l)=>a+(l.toneladas||0),0);
    const precoMedio=tonsVendidas>0?rec/tonsVendidas:0;
    resumo[f]={prod:p,vend:v,est:p-v,rec,precoMedio};
  });

  // Preço médio por tonelada ao longo do tempo
  const precoPorMes={};
  vendas.forEach(l=>{
    if(!l.data_lancamento||!l.valor||!l.toneladas) return;
    const d=new Date(l.data_lancamento+'T12:00:00');
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!precoPorMes[key]) precoPorMes[key]={rec:0,tons:0,label:MESES_PT[d.getMonth()]+'/'+String(d.getFullYear()).slice(2)};
    precoPorMes[key].rec+=(l.valor||0);
    precoPorMes[key].tons+=(l.toneladas||0);
  });

  document.getElementById('page-content').innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="ptitle">Carvão</div>
      </div>
      <button class="btn btn-primary" onclick="nav('lancamentos',document.querySelectorAll('.ni')[5])">➕ Lançar</button>
    </div>

    <div class="metrics">
      <div class="met"><div class="met-lbl">Estoque total</div><div class="met-val">${Object.values(resumo).reduce((a,v)=>a+v.est,0).toFixed(1)} t</div></div>
      <div class="met"><div class="met-lbl">Total produzido</div><div class="met-val">${Object.values(resumo).reduce((a,v)=>a+v.prod,0).toFixed(1)} t</div></div>
      <div class="met"><div class="met-lbl">Total vendido</div><div class="met-val">${Object.values(resumo).reduce((a,v)=>a+v.vend,0).toFixed(1)} t</div></div>
      <div class="met"><div class="met-lbl">Receita carvão</div><div class="met-val up">${fmt(Object.values(resumo).reduce((a,v)=>a+v.rec,0))}</div></div>
    </div>

    <div class="card">
      <div class="ch"><div class="ct">Estoque e preço por fazenda</div></div>
      <table class="tbl"><thead><tr><th>Fazenda</th><th>Produzido</th><th>Vendido</th><th>Estoque</th><th>Receita</th><th>Preço médio/t</th></tr></thead><tbody>
      ${fazendas.map(f=>{
        const r=resumo[f];
        return `<tr>
          <td style="font-weight:600">${f}</td>
          <td>${r.prod.toFixed(1)} t</td>
          <td>${r.vend.toFixed(1)} t</td>
          <td style="font-weight:600">${r.est.toFixed(1)} t</td>
          <td style="color:var(--green-mid);font-weight:600">${fmt(r.rec)}</td>
          <td style="color:var(--amber);font-weight:600">${r.precoMedio>0?fmt(r.precoMedio)+'/t':'—'}</td>
        </tr>`;
      }).join('')}
      </tbody></table>
    </div>

    ${Object.keys(precoPorMes).length>0?`
    <div class="card">
      <div class="ch"><div class="ct">Preço médio por tonelada — histórico</div></div>
      <table class="tbl"><thead><tr><th>Mês</th><th>Toneladas vendidas</th><th>Receita</th><th>Preço médio/t</th></tr></thead><tbody>
      ${Object.entries(precoPorMes).sort((a,b)=>b[0].localeCompare(a[0])).map(([key,m])=>`<tr>
        <td class="muted">${m.label}</td>
        <td>${m.tons.toFixed(1)} t</td>
        <td style="color:var(--green-mid);font-weight:600">${fmt(m.rec)}</td>
        <td style="color:var(--amber);font-weight:700">${fmt(m.rec/m.tons)}/t</td>
      </tr>`).join('')}
      </tbody></table>
    </div>`:''}

    <div class="card">
      <div class="ch"><div class="ct">Últimos lançamentos</div></div>
      ${lancs.length===0?'<div class="loading">Nenhum lançamento de carvão ainda</div>':`
      <table class="tbl"><thead><tr><th style="width:80px">Data</th><th>Fazenda</th><th style="width:80px">Tipo</th><th style="width:60px">Tons</th><th style="width:55px">Cargas</th><th style="text-align:right">Valor</th></tr></thead><tbody>
      ${[...lancs].sort((a,b)=>new Date(b.data_lancamento)-new Date(a.data_lancamento)).slice(0,10).map(l=>`<tr>
        <td class="muted">${l.data_lancamento?new Date(l.data_lancamento+'T12:00:00').toLocaleDateString('pt-BR').slice(0,5):'—'}</td>

      </tr>`).join('')}</tbody></table>`}
    </div>
  `;
}

    if(!dataPlantio) return '—';
    const plantio = new Date(dataPlantio+'T12:00:00');
    const anosCorte = 7;
    const proximoCorteData = new Date(plantio);
    proximoCorteData.setFullYear(proximoCorteData.getFullYear() + anosCorte * numCorte);

    const diffMeses = Math.round(diffMs / (1000*60*60*24*30));
    if(diffMeses < 0) return 'Pronto para corte!';

function showAddTalhao(){document.getElementById('add-talhao-form').style.display='block';document.getElementById('add-talhao-form').scrollIntoView({behavior:'smooth'})}
function showAddTalhaoFazenda(f){document.getElementById('add-talhao-form').style.display='block';document.getElementById('tf-fazenda').value=f;document.getElementById('add-talhao-form').scrollIntoView({behavior:'smooth'})}

async function salvarTalhao(){
  const data={fazenda:document.getElementById('tf-fazenda').value,nome:document.getElementById('tf-nome').value,hectares:parseFloat(document.getElementById('tf-ha').value)||null,data_plantio:document.getElementById('tf-data').value||null,numero_corte:parseInt(document.getElementById('tf-corte').value)};
  if(!data.nome){toast('Informe o nome do talhão',true);return}
  try{await sb('talhoes','POST',data);toast('Talhão salvo!');await renderPropriedades()}catch(e){toast('Erro: '+e.message,true)}
}
async function deleteTalhao(id){
  if(!confirm('Excluir este talhão?'))return;
  try{await sb('talhoes','DELETE',null,`?id=eq.${id}`);toast('Talhão removido');await renderPropriedades()}catch(e){toast('Erro: '+e.message,true)}
}

// ── FINANCEIRO ─────────────────────────────────────────────────────────────
async function renderFinanceiro(){
  const lancs = await sb('lancamentos','GET',null,'?order=data_lancamento.asc&limit=500');
  const CORES = ['#378ADD','#EF9F27','#97C459','#D85A30','#7F77DD','#5DCAA5','var(--danger)','#888780'];

  const porMes={};
  lancs.forEach(l=>{
    if(!l.data_lancamento) return;
    const d=new Date(l.data_lancamento+'T12:00:00');
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!porMes[key]) porMes[key]={label:MESES_FULL[d.getMonth()]+' '+d.getFullYear(),lancs:[]};
    porMes[key].lancs.push(l);
  });

  const mesesOrdenados=Object.entries(porMes).sort((a,b)=>b[0].localeCompare(a[0]));
  const totalRec=lancs.filter(l=>['venda-gado','venda-carvao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
  const totalDesp=lancs.filter(l=>['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
  const resultado=totalRec-totalDesp;

  // Fluxo de caixa acumulado
  let acumulado=0;
  const fluxo=Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0])).map(([key,mes])=>{
    const rec=mes.lancs.filter(l=>['venda-gado','venda-carvao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
    const desp=mes.lancs.filter(l=>['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
    acumulado+=rec-desp;
    return {label:mes.label,rec,desp,res:rec-desp,acumulado};
  });

  document.getElementById('page-content').innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="ptitle">Financeiro</div>
      </div>
      <button class="btn btn-primary" onclick="nav('lancamentos',document.querySelectorAll('.ni')[5])">➕ Lançar</button>
    </div>

    <div class="metrics">
      <div class="met"><div class="met-lbl">Receita total</div><div class="met-val up">${fmt(totalRec)}</div></div>
      <div class="met"><div class="met-lbl">Despesas totais</div><div class="met-val down">${fmt(totalDesp)}</div></div>
      <div class="met"><div class="met-lbl">Resultado geral</div><div class="met-val ${resultado>=0?'up':'down'}">${fmt(resultado)}</div>${totalRec>0?`<div class="met-sub ${resultado>=0?'up':'down'}">margem ${Math.round(resultado/totalRec*100)}%</div>`:''}</div>
      <div class="met"><div class="met-lbl">Meses registrados</div><div class="met-val">${mesesOrdenados.length}</div></div>
    </div>

    ${fluxo.length>0?`
    <div class="card">
      <div class="ch"><div class="ct">Fluxo de caixa acumulado</div></div>
      <div style="overflow-x:auto">
        <table class="tbl" style="table-layout:auto"><thead><tr><th>Mês</th><th style="text-align:right">Receita</th><th style="text-align:right">Despesa</th><th style="text-align:right">Resultado</th><th style="text-align:right">Acumulado</th></tr></thead><tbody>
        ${fluxo.map(m=>`<tr>
          <td style="font-weight:600;white-space:nowrap">${m.label}</td>
          <td style="text-align:right;color:var(--green-mid);font-weight:600">${fmt(m.rec)}</td>
          <td style="text-align:right;color:var(--danger);font-weight:600">${fmt(m.desp)}</td>
          <td style="text-align:right;font-weight:700;color:${m.res>=0?'var(--green-mid)':'var(--danger)'}">${fmt(m.res)}</td>
          <td style="text-align:right;font-weight:700;color:${m.acumulado>=0?'var(--green)':'var(--danger)'}">${fmt(m.acumulado)}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`:''}

    ${mesesOrdenados.map(([key,mes])=>{
      const rec=mes.lancs.filter(l=>['venda-gado','venda-carvao'].includes(l.tipo));
      const desp=mes.lancs.filter(l=>['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo));
      const tRec=rec.reduce((a,l)=>a+(l.valor||0),0);
      const tDesp=desp.reduce((a,l)=>a+(l.valor||0),0);
      const res=tRec-tDesp;
      const dCats={};
      desp.forEach(l=>{ const c=l.categoria||tipoLabel(l.tipo); dCats[c]=(dCats[c]||0)+(l.valor||0); });
      const dArr=Object.entries(dCats).sort((a,b)=>b[1]-a[1]);
      const lancOrd=[...mes.lancs].sort((a,b)=>new Date(b.data_lancamento)-new Date(a.data_lancamento));
      return `<div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px">
          <div style="font-size:15px;font-weight:700">${mes.label}</div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div style="font-size:13px;font-weight:600;color:var(--green-mid)">↑ ${fmt(tRec)}</div>
            <div style="font-size:13px;font-weight:600;color:var(--danger)">↓ ${fmt(tDesp)}</div>
            <div style="font-size:13px;font-weight:700;color:${res>=0?'var(--green)':'var(--danger)'}">= ${fmt(res)}</div>
          </div>
        </div>
        <div class="grid2" style="margin-bottom:10px">
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase">Receitas</div>
            ${rec.length===0?'<div style="font-size:12px;color:var(--text3)">Nenhuma receita</div>':rec.map(l=>`<div class="row"><div class="dot" style="background:${l.tipo==='venda-gado'?'var(--green-light)':'var(--coal)'}"></div><div style="flex:1;font-size:12px">${tipoLabel(l.tipo)}<span style="color:var(--text3);margin-left:4px">${l.data_lancamento?new Date(l.data_lancamento+'T12:00:00').toLocaleDateString('pt-BR').slice(0,5):''}</span></div><div style="font-weight:600;font-size:12px;color:var(--green-mid)">${fmt(l.valor)}</div></div>`).join('')}
          </div>
          <div>
            <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase">Despesas por categoria</div>
            ${dArr.length===0?'<div style="font-size:12px;color:var(--text3)">Nenhuma despesa</div>':dArr.map(([cat,val],i)=>`<div class="row"><div class="dot" style="background:${CORES[i%CORES.length]}"></div><div style="flex:1;font-size:12px">${cat}</div><div class="bar-wrap"><div class="bar-fill" style="width:${tDesp>0?Math.round(val/tDesp*100):0}%;background:${CORES[i%CORES.length]}"></div></div><div style="font-weight:600;font-size:12px;color:var(--danger);min-width:70px;text-align:right">${fmt(val)}</div></div>`).join('')}
          </div>
        </div>
        <details>
          <summary style="font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;padding:6px 0">Ver todos os lançamentos (${lancOrd.length})</summary>
          <table class="tbl" style="margin-top:10px;table-layout:auto"><thead><tr><th>Data</th><th>Por</th><th>Descrição</th><th>Propriedade</th><th style="text-align:right">Valor</th></tr></thead><tbody>
          ${lancOrd.map(l=>{const isRec=['venda-gado','venda-carvao'].includes(l.tipo);const data=l.data_lancamento?new Date(l.data_lancamento+'T12:00:00').toLocaleDateString('pt-BR').slice(0,5):'—';return`<tr><td class="muted">${data}</td><td class="muted">${l.registrado_por||'—'}</td><td>${l.descricao||tipoLabel(l.tipo)}</td><td class="muted">${l.propriedade||'—'}</td><td style="text-align:right;font-weight:600;color:${isRec?'var(--green-mid)':'var(--danger)'}">${fmt(l.valor)}</td><td style="text-align:right;white-space:nowrap"><button onclick="editarLancamento('${l.id}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--blue);margin-right:4px">✏️</button><button onclick="excluirLancamento('${l.id}')" style="background:none;border:none;cursor:pointer;font-size:13px;color:var(--danger)">🗑️</button></td></tr>`}).join('')}
          </tbody></table>
        </details>
      </div>`;
    }).join('')}
  `;
}

const LOTES=['Lote T1','Lote T2','Lote T3','Lote T4','Lote T5'];
const PROPS_C=['Pombinha','Pindorama','Morro da Garça','Área do Junco'];
const PROPS_ALL=['Taquara',...PROPS_C];
const DESP_CATS=['Folha salarial','Encargos trabalhistas','Financiamentos','Insumos do gado','Manutenção de pasto/floresta','Combustível','Máquinas e equipamentos','Transporte'];
const optsArr=arr=>arr.map(v=>`<option>${v}</option>`).join('');

function renderForm(){
  const t=tipoAtual;
  const ac=(bc,bl)=>`<div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)"><span class="badge ${bc}">${bl}</span><button class="btn btn-primary" onclick="confirmar()">👁️ Revisar e salvar</button></div>`;

  else if(t==='pesagem') html=`<div class="fields f3"><div class="field"><label>Data</label><input type="date" id="f-data"></div><div class="field"><label>Lote</label><select id="f-lote">${optsArr(LOTES)}</select></div><div class="field"><label>Peso médio (kg)</label><input type="number" id="f-peso" placeholder="Ex: 438"></div></div><div class="fields f2" style="margin-top:12px"><div class="field"><label>Peso mínimo (kg)</label><input type="number" id="f-pmin" placeholder="Ex: 390"></div><div class="field"><label>Peso máximo (kg)</label><input type="number" id="f-pmax" placeholder="Ex: 490"></div></div><div style="background:var(--green-bg);border-radius:var(--radius-sm);padding:10px 12px;margin-top:12px;font-size:12px;color:var(--green)" id="at-preview">Informe o peso médio para ver a @ estimada</div><div class="fields" style="margin-top:12px"><div class="field"><label>Observação</label><textarea id="f-obs" placeholder="Condição do pasto, lote..."></textarea></div></div>${ac('bb','Pesagem — operacional')}`;

function parseSiengePdf(text) {
  const textNorm = text.replace(/\s+/g, ' ');

  const resultado = {
    fazenda: '',
    mesAno: '',
    contas: [],
    totalEntradas: 0,
    totalSaidas: 0,
  };

  // Detectar fazenda
  const mFaz = textNorm.match(/Obra\s+\d+\s*-\s*Fazenda\s+([\w\s]+?)(?=Conta|Per|\d{2}\/)/i)
    || textNorm.match(/Fazenda\s+([\w\s]+?)(?=Conta|Per|\d{2}\/)/i);
  if (mFaz) resultado.fazenda = normalizarFazenda(mFaz[1].trim());

  // Detectar período — pega a data final para extrair mês/ano
  const mPer = textNorm.match(/\d{2}\/\d{2}\/\d{4}\s*(?:até|ate)\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (mPer) resultado.mesAno = mPer[2].padStart(2,'0') + '/' + mPer[3]; // mPer[1]=dia, mPer[2]=mês, mPer[3]=ano

  // Extrair Total de entradas e Total de saídas — valores mais confiáveis do PDF
  const mEnt = textNorm.match(/Total\s+de\s+entradas\s+([\d\.]+,[\d]{2})/i);
  if (mEnt) resultado.totalEntradas = parseFloat(mEnt[1].replace(/\./g,'').replace(',','.'));

  const mSai = textNorm.match(/Total\s+de\s+sa[ií]das\s+([\d\.]+,[\d]{2})/i);
  if (mSai) resultado.totalSaidas = parseFloat(mSai[1].replace(/\./g,'').replace(',','.'));

  // Extrair cada conta com seu total
  // Regex: "Conta X.X.X - Nome Tipo Resultado ... Total da conta VALOR"
  const regConta = /Conta\s+([\d\.]+)\s*-\s*(.+?)\s+Tipo\s+Resultado.+?Total\s+da\s+conta\s+(-?[\d\.]+,[\d]{2})/gi;
  let m;
  while ((m = regConta.exec(textNorm)) !== null) {
    const codigo = m[1].trim();
    const nome = m[2].trim().replace(/\s+/g,' ');
    const valStr = m[3].replace(/\./g,'').replace(',','.');
    const valor = parseFloat(valStr);
    if (!isNaN(valor) && valor !== 0) {
      // Classificar pelo código:
      // 1.x = receita/resultado (entradas)
      // 2.x = despesa (saídas)
      // Exceção: 1.03.03.02 Descontos Obtidos = dedução da receita (valor negativo)
      const isReceita = codigo.startsWith('1.');
      const isDespesa = codigo.startsWith('2.');
      const tipo = isReceita ? 'receita' : 'despesa';
      resultado.contas.push({ codigo, nome, total: valor, tipo });
    }
  }

  // Fallback: se regex não pegou nada, tenta linha a linha
  if (resultado.contas.length === 0) {
    const linhas = text.split('\n').map(l=>l.trim()).filter(Boolean);
    let contaAtual = null;
    for (let i = 0; i < linhas.length; i++) {
      const l = linhas[i];
      const mc = l.match(/Conta\s+([\d\.]+)\s*-\s*(.+?)(?:\s+Tipo|$)/i);
      if (mc) {
        const codigo = mc[1].trim();
        const tipo = codigo.startsWith('1.') ? 'receita' : 'despesa';
        contaAtual = { codigo, nome: mc[2].trim(), total: 0, tipo };
        resultado.contas.push(contaAtual);
        continue;
      }
      if (contaAtual && l.match(/Total\s+da\s+conta/i)) {
        const v = extrairValor(l) ?? (i+1 < linhas.length ? extrairValor(linhas[i+1]) : null);
        if (v !== null) contaAtual.total = v;
      }
    }
  }

  return resultado;
}

function extrairValor(texto) {
  // Remove caracteres não numéricos exceto vírgula, ponto e sinal negativo
  const m = texto.match(/(-?[\d\.]+,[\d]{2})/);
  if (!m) return null;
  const s = m[1].replace(/\./g, '').replace(',', '.');
  return parseFloat(s);
}

function normalizarFazenda(nome) {
  const n = nome.toLowerCase();
  if (n.includes('pindorama')) return 'Pindorama';
  if (n.includes('primavera')) return 'Primavera';
  if (n.includes('taquara')) return 'Taquara';
  if (n.includes('matriz')) return 'Matriz';
  return nome;
}

}

async function handleSiengeFile(file) {
  if (!file) return;
  const fazenda = document.getElementById('sienge-fazenda').value;
  const mes = document.getElementById('sienge-mes').value;
  if (!fazenda) { toast('Selecione a fazenda primeiro', true); return; }
  if (!mes) { toast('Selecione o mês de referência', true); return; }

  const preview = document.getElementById('sienge-preview');
  preview.style.display = 'block';
  preview.innerHTML = '<div class="loading">Lendo o PDF...</div>';

  try {
    // Ler PDF como texto via FileReader + PDF.js (inline)
    const arrayBuffer = await file.arrayBuffer();
    const text = await extrairTextoPDF(arrayBuffer);

    const parsed = parseSiengePdf(text);
    // Override com seleção manual se não detectou
    if (!parsed.fazenda) parsed.fazenda = fazenda;
    else parsed.fazenda = normalizarFazenda(parsed.fazenda);
    // Garantir formato sempre MM/YYYY
    if (!parsed.mesAno) {
      const [ano, m] = mes.split('-');
      parsed.mesAno = m.padStart(2,'0') + '/' + ano;
    } else {
      // Normalizar para MM/YYYY caso venha em outro formato
      const p = parsed.mesAno.split('/');
      if(p.length === 2) parsed.mesAno = p[0].padStart(2,'0') + '/' + p[1];
    }

    // Filtrar contas com valor != 0
    const contasValidas = parsed.contas.filter(c => c.total !== 0 && c.total !== null);

    if (contasValidas.length === 0) {
      preview.innerHTML = '<div style="color:var(--danger);font-size:13px;padding:8px">Não foi possível extrair dados do PDF. Verifique se é o relatório correto.</div>';
      return;
    }

    // Calcular totais da prévia para conferência
    const prevRec = contasValidas.filter(c=>c.tipo==='receita').reduce((a,c)=>a+c.total,0);
    const prevDesp = contasValidas.filter(c=>c.tipo==='despesa').reduce((a,c)=>a+c.total,0);
    const prevRes = prevRec - prevDesp;

    // Mostrar preview
    preview.innerHTML = `
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">Prévia — ${parsed.fazenda} · ${parsed.mesAno}</div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">

async function extrairTextoPDF(arrayBuffer) {
  // Usar PDF.js via CDN
  if (!window.pdfjsLib) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let texto = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const pageText = content.items.map(item => item.str).join(' ');
    texto += pageText + '\n';
  }
  return texto;
}

async function confirmarUploadSienge(contas, fazenda, mesAno) {
  try {
    // Buscar IDs existentes para essa fazenda+mês e deletar um por um
    const existentes = await sb('sienge_lancamentos','GET',null,
      `?fazenda=eq.${encodeURIComponent(fazenda)}&mes_ano=eq.${encodeURIComponent(mesAno)}&select=id`
    );
    for(const reg of existentes) {
      await sb('sienge_lancamentos','DELETE',null,`?id=eq.${reg.id}`);
    }

    // Inserir novas contas
    const registros = contas.map(c => {
      const map = Object.entries(MAPA_CONTAS).find(([k])=>c.codigo.startsWith(k));
      const cat = map ? map[1].cat : (c.codigo.startsWith('1.')?'Outros recebimentos':'Outros custos');
      const tipoRaw = map ? map[1].tipo : (c.codigo.startsWith('1.')?'receita':'despesa');

      // deducao = receita negativa (ex: Descontos Obtidos reduz a receita)
      // valor negativo no SIENGE = já é negativo, salvar como negativo
      let tipo, valor;
      if(tipoRaw === 'deducao') {
        tipo = 'receita';
        valor = -Math.abs(c.total); // sempre negativo
      } else if(c.total < 0) {
        // valor negativo em conta de receita = dedução
        tipo = c.codigo.startsWith('1.') ? 'receita' : 'despesa';
        valor = c.total; // manter negativo
      } else {
        tipo = tipoRaw;
        valor = Math.abs(c.total);
      }

      return {
        fazenda,
        mes_ano: mesAno,
        conta_codigo: c.codigo,
        conta_nome: c.nome,
        valor,
        tipo,
        categoria: cat,
        origem: 'SIENGE'
      };
    });

    // Inserir um por um (Supabase aceita array também)
    for (const r of registros) {
      await sb('sienge_lancamentos','POST',r);
    }

    toast(`${registros.length} contas importadas com sucesso!`);
    await renderSienge();
  } catch(e) {
    toast('Erro ao importar: '+e.message, true);
  }
}

async function excluirUploadSienge(fazenda, mesAno) {
  if (!confirm(`Excluir upload de ${fazenda} — ${mesAno}?`)) return;
  try {
    const existentes = await sb('sienge_lancamentos','GET',null,
      `?fazenda=eq.${encodeURIComponent(fazenda)}&mes_ano=eq.${encodeURIComponent(mesAno)}&select=id`
    );
    for(const reg of existentes) {
      await sb('sienge_lancamentos','DELETE',null,`?id=eq.${reg.id}`);
    }
    toast('Upload excluído');
    await renderSienge();
  } catch(e) { toast('Erro: '+e.message, true); }
}

// ── ALERTAS ────────────────────────────────────────────────────────────────
async function renderAlertas(){
  const [lancs, talhoes] = await Promise.all([
    sb('lancamentos','GET',null,'?order=data_lancamento.desc&limit=500'),
    sb('talhoes','GET',null,'?order=fazenda,nome')
  ]);

  const alertas = [];
  const hoje = new Date();

  // 1. Talhões prontos para corte
  talhoes.forEach(t=>{
    if(!t.data_plantio) return;
    const plantio = new Date(t.data_plantio+'T12:00:00');
    const proximoCorte = new Date(plantio);
    proximoCorte.setFullYear(proximoCorte.getFullYear() + 7 * (t.numero_corte||1));
    const diffMeses = Math.round((proximoCorte - hoje)/(1000*60*60*24*30));
    if(diffMeses <= 0) alertas.push({tipo:'danger', icon:'🌳', titulo:'Talhão pronto para corte', msg:`${t.fazenda} — ${t.nome} está pronto para corte!`, acao:'Registrar em Propriedades'});
    else if(diffMeses <= 6) alertas.push({tipo:'warning', icon:'⏰', titulo:'Corte próximo', msg:`${t.fazenda} — ${t.nome}: corte em ${diffMeses} meses`, acao:'Ver Propriedades'});
  });

  // 2. Lotes sem pesagem há mais de 30 dias
  const compras = lancs.filter(l=>l.tipo==='compra-gado');
  const lotes = [...new Set(compras.map(l=>l.lote).filter(Boolean))];
  const pesagens = lancs.filter(l=>l.tipo==='pesagem');
  lotes.forEach(lote=>{
    const ultimaPesagem = pesagens.filter(l=>l.lote===lote).sort((a,b)=>new Date(b.data_lancamento)-new Date(a.data_lancamento))[0];
    if(!ultimaPesagem){
      alertas.push({tipo:'warning', icon:'⚖️', titulo:'Sem pesagem registrada', msg:`${lote} nunca foi pesado`, acao:'Registrar pesagem'});
    } else {
      const diffDias = Math.round((hoje - new Date(ultimaPesagem.data_lancamento+'T12:00:00'))/(1000*60*60*24));
      if(diffDias > 30) alertas.push({tipo:'warning', icon:'⚖️', titulo:'Pesagem atrasada', msg:`${lote}: última pesagem há ${diffDias} dias`, acao:'Registrar pesagem'});
    }
  });

  // 3. Estoque de carvão zerado
  const fazendas = ['Pombinha','Pindorama','Morro da Garça','Área do Junco'];
  fazendas.forEach(f=>{
    const prod = lancs.filter(l=>l.tipo==='prod-carvao'&&l.propriedade===f).reduce((a,l)=>a+(l.toneladas||0),0);
    const vend = lancs.filter(l=>l.tipo==='venda-carvao'&&l.propriedade===f).reduce((a,l)=>a+(l.toneladas||0),0);
    if(prod>0 && (prod-vend)<=0) alertas.push({tipo:'danger', icon:'🔥', titulo:'Estoque zerado', msg:`${f}: sem carvão em estoque`, acao:'Registrar produção'});
    else if(prod>0 && (prod-vend)<5) alertas.push({tipo:'warning', icon:'🔥', titulo:'Estoque baixo', msg:`${f}: apenas ${(prod-vend).toFixed(1)}t em estoque`, acao:'Verificar produção'});
  });

  // 4. Meses sem lançamento financeiro
  const ultimoLanc = lancs.find(l=>l.data_lancamento);
  if(ultimoLanc){
    const diffDias = Math.round((hoje - new Date(ultimoLanc.data_lancamento+'T12:00:00'))/(1000*60*60*24));
    if(diffDias > 15) alertas.push({tipo:'warning', icon:'💰', titulo:'Lançamentos em atraso', msg:`Último lançamento há ${diffDias} dias`, acao:'Adicionar lançamento'});
  }

  // 5. Vacinações (lotes sem vacina nos últimos 6 meses)
  const vacinas = lancs.filter(l=>l.tipo==='vacinacao');
  lotes.forEach(lote=>{
    const ultimaVacina = vacinas.filter(l=>l.lote===lote||l.lote==='Todos os lotes').sort((a,b)=>new Date(b.data_lancamento)-new Date(a.data_lancamento))[0];
    if(!ultimaVacina){
      alertas.push({tipo:'warning', icon:'💉', titulo:'Sem vacina registrada', msg:`${lote}: nenhuma vacinação registrada`, acao:'Registrar vacinação'});
    } else {
      const diffDias = Math.round((hoje - new Date(ultimaVacina.data_lancamento+'T12:00:00'))/(1000*60*60*24));
      if(diffDias > 180) alertas.push({tipo:'warning', icon:'💉', titulo:'Vacinação em atraso', msg:`${lote}: última vacina há ${Math.round(diffDias/30)} meses`, acao:'Registrar vacinação'});
    }
  });

  const perigo = alertas.filter(a=>a.tipo==='danger');
  const atencao = alertas.filter(a=>a.tipo==='warning');

  document.getElementById('page-content').innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="ptitle">Alertas</div>
      </div>
      <span class="badge ${alertas.length>0?'br':'bg'}">${alertas.length} alerta${alertas.length!==1?'s':''}</span>
    </div>

    ${alertas.length===0?`
    <div class="card" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:12px">✅</div>
      <div style="font-size:16px;font-weight:700;color:var(--green);margin-bottom:6px">Tudo em ordem!</div>
      <div style="font-size:13px;color:var(--text2)">Nenhum alerta pendente no momento.</div>
    </div>`:`
    ${perigo.length>0?`
    <div style="font-size:12px;font-weight:700;color:var(--danger);margin-bottom:8px;text-transform:uppercase">⚠️ Ação imediata (${perigo.length})</div>
    ${perigo.map(a=>`
    <div style="background:var(--danger-bg);border:1px solid #E8B4B4;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <div style="font-size:24px">${a.icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--danger)">${a.titulo}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${a.msg}</div>
      </div>
      <button onclick="nav('lancamentos',document.querySelectorAll('.ni')[8])" class="btn" style="font-size:11px;white-space:nowrap">${a.acao}</button>
    </div>`).join('')}`:''}

    ${atencao.length>0?`
    <div style="font-size:12px;font-weight:700;color:var(--amber);margin-bottom:8px;margin-top:${perigo.length>0?'16px':'0'};text-transform:uppercase">⏰ Atenção (${atencao.length})</div>
    ${atencao.map(a=>`
    <div style="background:var(--amber-bg);border:1px solid #E8CCB4;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px">
      <div style="font-size:24px">${a.icon}</div>
      <div style="flex:1">
        <div style="font-size:13px;font-weight:700;color:var(--amber)">${a.titulo}</div>
        <div style="font-size:12px;color:var(--text2);margin-top:2px">${a.msg}</div>
      </div>
      <button onclick="nav('lancamentos',document.querySelectorAll('.ni')[8])" class="btn" style="font-size:11px;white-space:nowrap">${a.acao}</button>
    </div>`).join('')}`:''}
    `}
  `;
}

function showAddRecorrente(){
  document.getElementById('add-rec-form').style.display='block';
  document.getElementById('add-rec-form').scrollIntoView({behavior:'smooth'});
}

function salvarRecorrente(){
  const desc = document.getElementById('rec-desc').value;
  const cat  = document.getElementById('rec-cat').value;
  const prop = document.getElementById('rec-prop').value;
  const valStr = document.getElementById('rec-valor').value;
  if(!desc||!valStr){toast('Preencha descrição e valor',true);return}
  const val = parseFloat(valStr.trim().replace(/\./g,'').replace(',','.'));
  if(isNaN(val)){toast('Valor inválido',true);return}
  let recs = JSON.parse(localStorage.getItem('maisagro_recorrentes')||'[]');
  recs.push({descricao:desc, categoria:cat, propriedade:prop, valor:val});
  localStorage.setItem('maisagro_recorrentes', JSON.stringify(recs));
  toast('Recorrência salva!');
  renderRecorrentes();
}

function excluirRecorrente(i){
  if(!confirm('Remover esta recorrência?')) return;
  let recs = JSON.parse(localStorage.getItem('maisagro_recorrentes')||'[]');
  recs.splice(i,1);
  localStorage.setItem('maisagro_recorrentes', JSON.stringify(recs));
  toast('Recorrência removida');
  renderRecorrentes();
}

async function lancarRecorrente(i){
  let recs = JSON.parse(localStorage.getItem('maisagro_recorrentes')||'[]');
  const r = recs[i];
  const hoje = new Date();
  const data = hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-01';
  try{
    await sb('lancamentos','POST',{
      registrado_por: respAtual,
      tipo: 'despesa',
      propriedade: r.propriedade,
      categoria: r.categoria,
      descricao: r.descricao,
      valor: r.valor,
      data_lancamento: data,
    });
    toast('Lançado com sucesso!');
    renderRecorrentes();
  }catch(e){toast('Erro: '+e.message,true)}
}

// ── CONSOLIDADO ────────────────────────────────────────────────────────────
async function renderConsolidado(){
  const [lancs, siengeLancs] = await Promise.all([
    sb('lancamentos','GET',null,'?order=data_lancamento.asc&limit=500'),
    sb('sienge_lancamentos','GET',null,'?order=criado_em.asc&limit=5000').catch(()=>[])
  ]);
  const FAZENDAS = ['Taquara','Pindorama','Primavera','Morro da Garça','Área do Junco','Matriz'];
  const CORES = {'Taquara':'var(--green)','Pindorama':'var(--blue)','Primavera':'var(--green-light)','Morro da Garça':'var(--amber)','Área do Junco':'var(--coal)','Matriz':'#7F77DD'};
  const mesesSet = new Set();
  lancs.forEach(l=>{ if(l.data_lancamento){ const d=new Date(l.data_lancamento+'T12:00:00'); mesesSet.add(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }});
  siengeLancs.forEach(l=>{ if(l.mes_ano){ const p=l.mes_ano.split('/'); if(p.length===2) mesesSet.add(p[1]+'-'+p[0].padStart(2,'0')); }});
  const todosOsMeses = [...mesesSet].sort((a,b)=>b.localeCompare(a));
  const mesSel = document.getElementById('cons-mes')?.value || todosOsMeses[0] || '';
  function dadosFazenda(fazenda, mes) {
    const lancFaz = lancs.filter(l=>{ if(!l.data_lancamento) return false; const d=new Date(l.data_lancamento+'T12:00:00'); const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); return key===mes&&(l.propriedade===fazenda||(fazenda==='Taquara'&&!l.propriedade)); });
    const recManual=lancFaz.filter(l=>['venda-gado','venda-carvao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
    const despManual=lancFaz.filter(l=>['compra-gado','vacinacao','despesa','manutencao'].includes(l.tipo)).reduce((a,l)=>a+(l.valor||0),0);
    const mesAnoFmt=mes.split('-')[1]+'/'+mes.split('-')[0];
    const siengeFaz=siengeLancs.filter(l=>l.fazenda===fazenda&&l.mes_ano===mesAnoFmt);
    const recSienge=siengeFaz.filter(l=>l.tipo==='receita').reduce((a,l)=>a+(l.valor||0),0);
    const despSienge=siengeFaz.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+(l.valor||0),0);
    const rec=recManual+recSienge, desp=despManual+despSienge;
    return {rec,desp,res:rec-desp,hasSienge:siengeFaz.length>0,hasManual:lancFaz.length>0,lancamentos:lancFaz.length+siengeFaz.length};
  }
  const dados={};
  FAZENDAS.forEach(f=>{dados[f]=dadosFazenda(f,mesSel);});
  const totalRec=Object.values(dados).reduce((a,d)=>a+d.rec,0);
  const totalDesp=Object.values(dados).reduce((a,d)=>a+d.desp,0);
  const totalRes=totalRec-totalDesp;
  const mesLabel=mesSel?MESES_FULL[parseInt(mesSel.split('-')[1])-1]+' '+mesSel.split('-')[0]:'—';
  document.getElementById('page-content').innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="ptitle">Consolidado</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <select id="cons-mes" onchange="renderConsolidado()" style="font-size:12px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white)">
          ${todosOsMeses.map(m=>{const label=MESES_FULL[parseInt(m.split('-')[1])-1]+' '+m.split('-')[0];return`<option value="${m}" ${m===mesSel?'selected':''}>${label}</option>`;}).join('')}
        </select>
        <button class="btn btn-primary" onclick="exportarConsolidadoPDF('${mesLabel}')">📄 Exportar PDF</button>
      </div>
    </div>
    <div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="met"><div class="met-lbl">💰 Receita total</div><div class="met-val up">${fmt(totalRec)}</div><div class="met-sub neu">${mesLabel}</div></div>
      <div class="met"><div class="met-lbl">💸 Despesas totais</div><div class="met-val down">${fmt(totalDesp)}</div></div>
      <div class="met"><div class="met-lbl">📊 Resultado</div><div class="met-val ${totalRes>=0?'up':'down'}">${fmt(totalRes)}</div>${totalRec>0?`<div class="met-sub ${totalRes>=0?'up':'down'}">margem ${Math.round(totalRes/totalRec*100)}%</div>`:''}</div>
    </div>
    <div class="card">
      <div class="ch"><div class="ct">Resultado por fazenda — ${mesLabel}</div></div>
      <div style="overflow-x:auto">
        <table class="tbl" style="table-layout:auto">
          <thead><tr><th>Fazenda</th><th style="text-align:right">Receita</th><th style="text-align:right">Despesa</th><th style="text-align:right">Resultado</th><th style="text-align:center">Margem</th><th style="text-align:center">Fonte</th></tr></thead>
          <tbody>
          ${FAZENDAS.map(f=>{const d=dados[f];if(d.lancamentos===0)return'';const margem=d.rec>0?Math.round(d.res/d.rec*100):null;return`<tr><td><div style="display:flex;align-items:center;gap:8px"><div style="width:10px;height:10px;border-radius:50%;background:${CORES[f]}"></div><span style="font-weight:600">${f}</span></div></td><td style="text-align:right;color:var(--green-mid);font-weight:600">${d.rec>0?fmt(d.rec):'—'}</td><td style="text-align:right;color:var(--danger);font-weight:600">${d.desp>0?fmt(d.desp):'—'}</td><td style="text-align:right;font-weight:700;color:${d.res>=0?'var(--green-mid)':'var(--danger)'}">${d.lancamentos>0?fmt(d.res):'—'}</td><td style="text-align:center">${margem!==null?`<span class="badge ${margem>=0?'bg':'br'}">${margem}%</span>`:'—'}</td><td style="text-align:center;font-size:11px;color:var(--text2)">${d.hasSienge&&d.hasManual?'SIENGE+Manual':d.hasSienge?'SIENGE':d.hasManual?'Manual':'—'}</td></tr>`;}).join('')}
          </tbody>
          <tfoot><tr style="border-top:2px solid var(--border)"><td style="font-weight:700">TOTAL</td><td style="text-align:right;font-weight:700;color:var(--green-mid)">${fmt(totalRec)}</td><td style="text-align:right;font-weight:700;color:var(--danger)">${fmt(totalDesp)}</td><td style="text-align:right;font-weight:800;font-size:14px;color:${totalRes>=0?'var(--green)':'var(--danger)'}">${fmt(totalRes)}</td><td style="text-align:center">${totalRec>0?`<span class="badge ${totalRes>=0?'bg':'br'}">${Math.round(totalRes/totalRec*100)}%</span>`:'—'}</td><td></td></tr></tfoot>
        </table>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">
      ${FAZENDAS.map(f=>{const d=dados[f];if(d.lancamentos===0)return`<div class="card" style="margin-bottom:0;opacity:0.5"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="width:12px;height:12px;border-radius:50%;background:${CORES[f]}"></div><div style="font-size:14px;font-weight:700">${f}</div></div><div style="font-size:12px;color:var(--text3)">Sem lançamentos neste mês</div></div>`;return`<div class="card" style="margin-bottom:0;border-left:3px solid ${CORES[f]}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><div style="width:12px;height:12px;border-radius:50%;background:${CORES[f]}"></div><div style="font-size:14px;font-weight:700">${f}</div></div><span class="badge ${d.res>=0?'bg':'br'}">${fmt(d.res)}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div style="background:var(--green-bg);border-radius:var(--radius-sm);padding:8px 10px"><div style="font-size:10px;color:var(--green);font-weight:600;text-transform:uppercase;margin-bottom:2px">Receita</div><div style="font-size:14px;font-weight:700;color:var(--green-mid)">${fmt(d.rec)}</div></div><div style="background:var(--danger-bg);border-radius:var(--radius-sm);padding:8px 10px"><div style="font-size:10px;color:var(--danger);font-weight:600;text-transform:uppercase;margin-bottom:2px">Despesa</div><div style="font-size:14px;font-weight:700;color:var(--danger)">${fmt(d.desp)}</div></div></div>${d.hasSienge?'<div style="font-size:10px;color:var(--text3);margin-top:8px;text-align:right">📤 Inclui dados SIENGE</div>':''}</div>`;}).join('')}
    </div>`;
}

  janela.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>MaisAgro — Consolidado ${mesLabel}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;padding:32px;color:#18181B;font-size:13px}h1{font-size:20px;font-weight:800;color:#1E4D08;margin-bottom:4px}.sub{font-size:13px;color:#62605C;margin-bottom:24px}table{width:100%;border-collapse:collapse;margin-bottom:24px}th{text-align:left;font-size:11px;font-weight:600;color:#62605C;padding:0 10px 8px;border-bottom:2px solid #E2DDD6;text-transform:uppercase}td{padding:10px;border-bottom:1px solid #E2DDD6}tfoot td{font-weight:700;border-top:2px solid #18181B;border-bottom:none}.up{color:#2E6B0F;font-weight:700}.down{color:#B91C1C;font-weight:700}.footer{margin-top:32px;font-size:11px;color:#A09D98;text-align:center;border-top:1px solid #E2DDD6;padding-top:16px}button,select{display:none}@media print{body{padding:20px}}</style></head><body><h1>🌿 MaisAgro — Relatório Consolidado</h1><div class="sub">${mesLabel} · Gerado em ${new Date().toLocaleDateString('pt-BR')}</div>${el.innerHTML}<div class="footer">MaisAgro — Gestão integrada de pecuária e carvão vegetal</div></body></html>`);

// ── EDITAR / EXCLUIR LANÇAMENTOS ─────────────────────────────────────────
async function excluirLancamento(id){
  if(!confirm('Tem certeza que quer excluir este lançamento?')) return;
  try{
    await sb('lancamentos','DELETE',null,`?id=eq.${id}`);
    toast('Lançamento excluído!');
    renderPage(currentPage);
  }catch(e){toast('Erro: '+e.message,true)}
}

async function editarLancamento(id){
  try{
    const res = await sb('lancamentos','GET',null,`?id=eq.${id}`);
    const l = res[0];
    if(!l) return;

    const fmtValor = v => v!=null ? parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2}) : '';
    const optsArr = arr => arr.map(v=>`<option ${l.propriedade===v||l.lote===v?'selected':''}>${v}</option>`).join('');
    const LOTES=['Lote T1','Lote T2','Lote T3','Lote T4','Lote T5'];
    const PROPS_C=['Pombinha','Pindorama','Morro da Garça','Área do Junco'];
    const PROPS_ALL=['Taquara',...PROPS_C];
    const DESP_CATS=['Folha salarial','Encargos trabalhistas','Financiamentos','Insumos do gado','Manutenção de pasto/floresta','Combustível','Máquinas e equipamentos','Transporte'];

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.id = 'edit-modal';
    modal.innerHTML = `
      <div class="modal">
        <div class="modal-title">✏️ Editar lançamento — ${tipoLabel(l.tipo)}</div>
        <div class="fields f2" style="margin-bottom:12px">
          <div class="field"><label>Data</label><input type="date" id="el-data" value="${l.data_lancamento||''}"></div>
          <div class="field"><label>Registrado por</label>
            <select id="el-resp">
              ${['Eduardo','Henrique','Ana Beatriz','Júlio'].map(n=>`<option ${l.registrado_por===n?'selected':''}>${n}</option>`).join('')}
            </select>
          </div>
          ${['compra-gado','venda-gado','pesagem','vacinacao'].includes(l.tipo)?`
          <div class="field"><label>Lote</label><select id="el-lote">${LOTES.concat(['Todos os lotes']).map(v=>`<option ${l.lote===v?'selected':''}>${v}</option>`).join('')}</select></div>
          <div class="field"><label>Quantidade (cab.)</label><input type="number" id="el-qtd" value="${l.quantidade||''}"></div>
          <div class="field"><label>Peso médio (kg)</label><input type="number" id="el-peso" value="${l.peso_medio||''}"></div>`:''}
          ${['prod-carvao','venda-carvao'].includes(l.tipo)?`
          <div class="field"><label>Fazenda</label><select id="el-prop">${PROPS_C.map(v=>`<option ${l.propriedade===v?'selected':''}>${v}</option>`).join('')}</select></div>
          <div class="field"><label>Toneladas</label><input type="number" id="el-ton" step="0.1" value="${l.toneladas||''}"></div>
          <div class="field"><label>Cargas</label><input type="number" id="el-cargas" value="${l.cargas||''}"></div>`:''}
          ${['despesa','manutencao'].includes(l.tipo)?`
          <div class="field"><label>Propriedade</label><select id="el-prop">${PROPS_ALL.map(v=>`<option ${l.propriedade===v?'selected':''}>${v}</option>`).join('')}</select></div>
          <div class="field"><label>Categoria</label><select id="el-cat">${DESP_CATS.map(v=>`<option ${l.categoria===v?'selected':''}>${v}</option>`).join('')}</select></div>`:''}
          <div class="field"><label>Valor (R$)</label><input type="text" id="el-valor" inputmode="decimal" value="${fmtValor(l.valor)}"></div>
          <div class="field"><label>Descrição</label><input type="text" id="el-desc" value="${l.descricao||''}"></div>
        </div>
        <div class="fields" style="margin-bottom:14px">
          <div class="field"><label>Observação</label><textarea id="el-obs">${l.observacao||''}</textarea></div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="document.getElementById('edit-modal').remove()" style="flex:1">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarEdicao('${id}')" style="flex:2;justify-content:center">💾 Salvar alterações</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
  }catch(e){toast('Erro: '+e.message,true)}
}

async function salvarEdicao(id){
  const g = id2 => { const el=document.getElementById(id2); return el?el.value||null:null; };
  const gVal = id2 => { const el=document.getElementById(id2); if(!el||!el.value)return null; const v=el.value.trim().replace(/\./g,'').replace(',','.'); const n=parseFloat(v); return isNaN(n)?null:n; };

  const data = {
    data_lancamento: g('el-data'),
    registrado_por:  g('el-resp'),
    lote:            g('el-lote'),
    quantidade:      g('el-qtd')    ? parseFloat(g('el-qtd'))    : null,
    peso_medio:      g('el-peso')   ? parseFloat(g('el-peso'))   : null,
    toneladas:       g('el-ton')    ? parseFloat(g('el-ton'))    : null,
    cargas:          g('el-cargas') ? parseInt(g('el-cargas'))   : null,
    propriedade:     g('el-prop'),
    categoria:       g('el-cat'),
    valor:           gVal('el-valor'),
    descricao:       g('el-desc'),
    observacao:      g('el-obs'),
  };
  // Remove nulls to avoid overwriting with null
  Object.keys(data).forEach(k=>{ if(data[k]===null) delete data[k]; });

  try{
    await sb('lancamentos','PATCH',data,`?id=eq.${id}`);
    document.getElementById('edit-modal').remove();
    toast('Lançamento atualizado!');
    renderPage(currentPage);
  }catch(e){toast('Erro: '+e.message,true)}
}

function tipoLabel(t){
  const m={'compra-gado':'Compra de gado','venda-gado':'Venda de gado','pesagem':'Pesagem','vacinacao':'Vacinação','prod-carvao':'Produção de carvão','venda-carvao':'Venda de carvão','despesa':'Despesa operacional','manutencao':'Manutenção'};
  return m[t]||t;
}

verificarLogin();
if(sessionStorage.getItem('maisagro_user')) renderPage('dashboard').then(()=>carregarArroba());
</script>
